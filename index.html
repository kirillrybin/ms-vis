<script type="importmap">
{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';

/* ------------------------------------------------------------------ */
/* GLSL                                                                */
/* ------------------------------------------------------------------ */
const GLSL_NOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.0,i1.z,i2.z,1.0))
   +i.y+vec4(0.0,i1.y,i2.y,1.0))
   +i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const GLSL_DISP = /* glsl */`
uniform float uTime;
uniform float uAmp;   // 0..1  (CC74 -> amplitude)
uniform float uFreq;  // noise frequency (CC74 -> frequency)
uniform float uKick;  // kick envelope 0..1
uniform float uBeat;  // beat pulse from MIDI clock 0..1
uniform float uShrink; // 0..1, the core collapses while it changes shape
uniform float uSharp; // sharpness of the shape (MIDI-controlled), 1 = neutral
uniform vec3  uBand;  // MIDI clock scanner: x = angle (rad), y = strength
uniform vec3  uWaveDir[6]; // origin of the ripple of each MIDI channel
uniform float uWaveAge[6]; // seconds since the hit
uniform float uWaveAmt[6]; // strength (decays on the CPU), 0 = inactive
// a clean thin ring that expands from the channel's origin; it is shown mostly by light and colour
float waves(vec3 p){
  vec3 n = normalize(p);
  float w = 0.0;
  for (int i = 0; i < 6; i++) {
    if (uWaveAmt[i] < 0.01) continue;
    float ang = acos(clamp(dot(n, uWaveDir[i]), -1.0, 1.0));
    float front = 0.1 + uWaveAge[i] * 1.9;                  // radius of the ring (radians from the origin)
    w += uWaveAmt[i] * exp(-pow((ang - front) / 0.2, 2.0));
  }
  return w;
}
// a great circle that sweeps around the core once per bar, with a short tail behind it
float band(vec3 p){
  vec3 n  = normalize(p);
  vec3 bn = vec3(cos(uBand.x), 0.0, sin(uBand.x));      // normal of the band plane
  vec3 bt = vec3(-sin(uBand.x), 0.0, cos(uBand.x));     // direction the normal is moving
  float s = dot(n, bn);
  float core  = exp(-pow(s / 0.07, 2.0));
  float trail = step(0.0, s * dot(n, bt)) * exp(-abs(s) / 0.3) * 0.45;   // only on the side it has already passed
  return (core + trail) * uBand.y;
}
float disp(vec3 p){
  vec3 q = p*uFreq + vec3(0.0, uTime*0.35, uTime*0.2);
  float n  = snoise(q);
  float k2 = uAmp * uAmp;
  float n2 = k2 > 0.002 ? snoise(q*2.3 + 7.0) : 0.0;   // 2nd octave only when audible
  float spike = pow(max(n,0.0), 2.0) * uAmp * uAmp * 1.6 * uSharp;
  float extra = max(uSharp - 1.0, 0.0) * 0.3 * pow(max(n,0.0), 2.0);   // sharpness above neutral adds spikes even on a smooth sphere
  return n*uAmp*0.45 + n2*uAmp*uAmp*0.25*uSharp + spike + extra;
}
vec3 displace(vec3 p, out float d, out float wv){
  wv = waves(p);
  d = disp(p) + wv * 0.08;                  // the ring barely moves the shape
  return p * (1.0 + uKick*0.32 + uBeat*0.09 + d) * (1.0 - uShrink);
}`;

const ORANGE = new THREE.Color(0xff5500);
const HAT_TRAIL = 5;   // samples per hi-hat particle (head + trail)

const coreVert = /* glsl */`
${GLSL_NOISE}
${GLSL_DISP}
attribute float aRand;
uniform float uPx;
uniform float uDensity;
uniform float uSize;
uniform float uBright;
varying float vAccent;
varying float vBright;
void main(){
  float d, wv;
  vec3 p = displace(position, d, wv);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  if (aRand > uDensity) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); }
  gl_PointSize = (1.2 + aRand*1.6) * uSize * uPx * (3.2 / -mv.z);
  float accent = step(aRand, 0.035);                 // rare orange particles
  float bd = band(position);
  vAccent = clamp(accent * (0.55 + uKick*0.45) + wv * 1.6 + bd * 1.2, 0.0, 1.0);   // ripple crest and scanner turn orange
  vBright = clamp(0.35 + abs(d)*1.6 + uKick*0.5 + wv*1.4 + uBeat*0.25 + bd*0.7, 0.0, 1.5) * uBright;
}`;
const coreFrag = /* glsl */`
uniform vec3 uOrange;
varying float vAccent;
varying float vBright;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float r = length(c);
  if(r > 0.5) discard;
  float a = smoothstep(0.5, 0.0, r);
  vec3 col = mix(vec3(vBright), uOrange * 1.4, vAccent);
  gl_FragColor = vec4(col, a);
}`;

const wireVert = /* glsl */`
${GLSL_NOISE}
${GLSL_DISP}
varying float vD;
varying float vW;
varying float vB;
void main(){
  float d, wv;
  vec3 p = displace(position, d, wv);
  vD = d; vW = wv; vB = band(position);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const wireFrag = /* glsl */`
uniform vec3 uOrange;
uniform float uKick;
uniform float uBeat;
varying float vD;
varying float vW;
varying float vB;
void main(){
  float k = 0.10 + abs(vD)*0.5 + uKick*0.25 + vW*0.5 + uBeat*0.2 + vB*0.6;
  vec3 col = mix(vec3(0.85), uOrange, clamp(uKick*0.35 + max(vD,0.0)*0.6 + vW*1.5 + vB*1.3, 0.0, 0.95));
  gl_FragColor = vec4(col, clamp(k, 0.0, 0.7));
}`;

const hatVert = /* glsl */`
attribute vec3 aVel;
attribute float aBirth;
attribute float aLife0;
attribute float aDecay;
attribute float aKind;
attribute float aStep;      // 0 = head, 1..T-1 = trail samples
uniform float uPx;
uniform float uTime;
uniform float uTrail;       // seconds between trail samples
varying float vLife;
varying float vKind;
varying float vFade;
void main(){
  float age = uTime - aBirth - aStep * uTrail;
  float life = aLife0 - aDecay * (uTime - aBirth);
  vKind = aKind;
  vFade = 1.0 - aStep / ${HAT_TRAIL}.0;
  vLife = life;
  if (age < 0.0 || life <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
  vec4 mv = modelViewMatrix * vec4(position + aVel * age, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = (0.6 + life * 1.8) * (0.4 + 0.6 * vFade) * uPx * (3.2 / -mv.z);
}`;
const hatFrag = /* glsl */`
uniform vec3 uOrange;
varying float vLife;
varying float vKind;
varying float vFade;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  if(length(c) > 0.5 || vLife <= 0.001) discard;
  vec3 col = mix(vec3(1.0), uOrange*1.5, vKind);
  gl_FragColor = vec4(col, clamp(vLife, 0.0, 1.0) * vFade * vFade);
}`;

const invertShader = {
  uniforms: { tDiffuse: { value: null }, uInvert: { value: 0 } },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uInvert; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); gl_FragColor = vec4(mix(c.rgb, 1.0 - c.rgb, uInvert), 1.0); }`
};

/* ------------------------------------------------------------------ */
/* Scene                                                               */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
let curPR = PR;
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
const BASE_Z = 4.6;
camera.position.set(0, 0, BASE_Z);

const shared = {
  uTime: { value: 0 }, uAmp: { value: 0.12 }, uFreq: { value: 1.0 },
  uKick: { value: 0 }, uBeat: { value: 0 }, uShrink: { value: 0 }, uSharp: { value: 1 }, uBand: { value: new THREE.Vector3() },
  uWaveDir: { value: Array.from({ length: 6 }, () => new THREE.Vector3(0, 1, 0)) },
  uWaveAge: { value: new Array(6).fill(0) }, uWaveAmt: { value: new Array(6).fill(0) },
  uDensity: { value: 1 }, uSize: { value: 1 }, uBright: { value: 1 }, uPx: { value: PR * innerHeight / 900 },
  uOrange: { value: ORANGE }
};

const world = new THREE.Group();
scene.add(world);

// --- Core shapes: every shape is a cloud of particles plus a wireframe, all deformed by the same shader ---
const N = 36000;
const SHAPES = {
  sphere: null,                                                    // fibonacci sphere + icosphere, built below
  torus:  () => new THREE.TorusGeometry(0.72, 0.3, 24, 64),
  cube:   () => new THREE.BoxGeometry(1.4, 1.4, 1.4, 8, 8, 8),
  knot:   () => new THREE.TorusKnotGeometry(0.62, 0.17, 160, 14, 2, 3),
  disc:   () => new THREE.CylinderGeometry(1.15, 1.15, 0.2, 56, 4).rotateX(0.75),  // tilted, so it does not turn edge-on
  teapot: () => {                                                  // the Utah teapot, centred and scaled to fit the same space as the other shapes
    const g = new TeapotGeometry(1, 10, true, true, true, true, true);
    g.computeBoundingBox();
    const c = g.boundingBox.getCenter(new THREE.Vector3());
    g.translate(-c.x, -c.y, -c.z);
    g.computeBoundingBox();
    const sz = g.boundingBox.getSize(new THREE.Vector3());
    return g.scale(...Array(3).fill(2.7 / Math.max(sz.x, sz.y, sz.z))).rotateY(-0.6);
  }
};
const SHAPE_LABELS = [['sphere', 'Sphere'], ['torus', 'Torus'], ['cube', 'Cube'], ['knot', 'Knot'], ['disc', 'Disc'], ['teapot', 'Teapot']];
const coreMat = new THREE.ShaderMaterial({
  vertexShader: coreVert, fragmentShader: coreFrag, uniforms: shared,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const wireMat = new THREE.ShaderMaterial({
  vertexShader: wireVert, fragmentShader: wireFrag, uniforms: shared,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
function mulberry32(a) {                     // small seeded RNG: the same shape always gets the same particles
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function sampleSurface(geo, count, rng) {    // uniform random points on the surface of any triangle mesh
  const g = geo.index ? geo.toNonIndexed() : geo;
  const pos = g.attributes.position, tri = pos.count / 3;
  const cum = new Float64Array(tri);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3();
  let total = 0;
  for (let i = 0; i < tri; i++) {
    a.fromBufferAttribute(pos, i * 3); b.fromBufferAttribute(pos, i * 3 + 1); c.fromBufferAttribute(pos, i * 3 + 2);
    total += ab.subVectors(b, a).cross(ac.subVectors(c, a)).length() * 0.5;
    cum[i] = total;
  }
  const out = new Float32Array(count * 3);
  for (let n = 0; n < count; n++) {
    const r = rng() * total;
    let lo = 0, hi = tri - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    a.fromBufferAttribute(pos, lo * 3); b.fromBufferAttribute(pos, lo * 3 + 1); c.fromBufferAttribute(pos, lo * 3 + 2);
    let u = rng(), v = rng();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    out[n * 3]     = a.x + (b.x - a.x) * u + (c.x - a.x) * v;
    out[n * 3 + 1] = a.y + (b.y - a.y) * u + (c.y - a.y) * v;
    out[n * 3 + 2] = a.z + (b.z - a.z) * u + (c.z - a.z) * v;
  }
  return out;
}
const shapeGroups = {};
for (const id of Object.keys(SHAPES)) {
  const rng = mulberry32(1234 + id.length * 97);
  let pts, wireGeo, tmp = null;
  if (id === 'sphere') {
    pts = new Float32Array(N * 3);
    const ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = ga * i;
      pts[i*3] = Math.cos(t) * r; pts[i*3+1] = y; pts[i*3+2] = Math.sin(t) * r;
    }
    tmp = new THREE.IcosahedronGeometry(1, 5);
  } else {
    tmp = SHAPES[id]();
    pts = sampleSurface(tmp, N, rng);
  }
  wireGeo = new THREE.WireframeGeometry(tmp);
  tmp.dispose();
  const rnd = new Float32Array(N);
  for (let i = 0; i < N; i++) rnd[i] = rng();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  g.setAttribute('aRand', new THREE.BufferAttribute(rnd, 1));
  const grp = new THREE.Group();
  grp.add(new THREE.Points(g, coreMat), new THREE.LineSegments(wireGeo, wireMat));
  grp.visible = false;
  world.add(grp);
  shapeGroups[id] = grp;
}
// switching shape: the core collapses, swaps at the smallest size and blooms back
const shapeState = { cur: 'sphere', pending: null, t: 0 };
const SHAPE_TIME = 0.5;
function showShape(id) { for (const k in shapeGroups) shapeGroups[k].visible = k === id; shapeState.cur = id; }
function setShape(id) {
  if (!shapeGroups[id] || (id === shapeState.cur && !shapeState.pending)) return;
  shapeState.pending = id; shapeState.t = 0;
}

// --- Hi-hat particle pool (simulated in the vertex shader, with trails) ---
const HAT_MAX = 900;
const HAT_SLOTS = HAT_MAX * HAT_TRAIL;     // each particle owns HAT_TRAIL vertices
const hat = {
  pos: new Float32Array(HAT_SLOTS * 3), vel: new Float32Array(HAT_SLOTS * 3),
  birth: new Float32Array(HAT_SLOTS), life0: new Float32Array(HAT_SLOTS),
  decay: new Float32Array(HAT_SLOTS), kind: new Float32Array(HAT_SLOTS),
  step: new Float32Array(HAT_SLOTS),
  head: 0, dirty: false
};
for (let i = 0; i < HAT_SLOTS; i++) hat.step[i] = i % HAT_TRAIL;
const hatGeo = new THREE.BufferGeometry();
const hatAttrs = {
  position: [hat.pos, 3], aVel: [hat.vel, 3], aBirth: [hat.birth, 1],
  aLife0: [hat.life0, 1], aDecay: [hat.decay, 1], aKind: [hat.kind, 1], aStep: [hat.step, 1]
};
for (const [name, [arr, n]] of Object.entries(hatAttrs)) {
  hatGeo.setAttribute(name, new THREE.BufferAttribute(arr, n).setUsage(THREE.DynamicDrawUsage));
}
const hatPoints = new THREE.Points(hatGeo, new THREE.ShaderMaterial({
  vertexShader: hatVert, fragmentShader: hatFrag,
  uniforms: { uPx: shared.uPx, uTime: shared.uTime, uOrange: shared.uOrange, uTrail: { value: 0.045 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
hatPoints.frustumCulled = false;
world.add(hatPoints);

function spawnHat(vel) {
  const count = Math.round((10 + (vel / 127) * 26) * cfg.hatAmount);
  const now = shared.uTime.value;
  for (let n = 0; n < count; n++) {
    const pi = hat.head; hat.head = (hat.head + 1) % HAT_MAX;
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const dx = s * Math.cos(t), dy = u, dz = s * Math.sin(t);
    const r = 1.3 + Math.random() * 0.9;
    const sp = 0.15 + Math.random() * 0.5;
    const life0 = 0.4 + (vel / 127) * 0.6, decay = 0.8 + Math.random() * 1.2;
    const kind = Math.random() < 0.08 ? 1 : 0;
    for (let k = 0; k < HAT_TRAIL; k++) {          // same data for head and every trail sample
      const i = pi * HAT_TRAIL + k;
      hat.pos[i*3] = dx * r; hat.pos[i*3+1] = dy * r; hat.pos[i*3+2] = dz * r;
      hat.vel[i*3] = dx * sp; hat.vel[i*3+1] = dy * sp; hat.vel[i*3+2] = dz * sp;
      hat.birth[i] = now; hat.life0[i] = life0; hat.decay[i] = decay; hat.kind[i] = kind;
    }
  }
  hat.dirty = true;   // uploaded once per frame, only when something spawned
}
function uploadHat() {
  if (!hat.dirty) return;
  for (const name in hatAttrs) hatGeo.attributes[name].needsUpdate = true;
  hat.dirty = false;
}

// --- Rings (channels 4,5,6) ---
const RING_R = [1.65, 1.95, 2.3];
const rings = RING_R.map((radius, i) => {
  const seg = 256, pts = new Float32Array(seg * 3);
  for (let k = 0; k < seg; k++) {
    const a = (k / seg) * Math.PI * 2;
    pts[k*3] = Math.cos(a) * radius; pts[k*3+1] = Math.sin(a) * radius; pts[k*3+2] = 0;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false });
  const line = new THREE.LineLoop(g, mat);
  const holder = new THREE.Group();
  holder.add(line);
  holder.rotation.set(0.6 + i * 0.9, i * 0.7, 0);
  world.add(holder);
  return { holder, line, mat, pulse: 0, hold: 0, note: -1, spin: (i % 2 ? -1 : 1) * (0.15 + i * 0.05), spinTarget: 0.2, tilt: holder.rotation.x };
});

const grainShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.04 } },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uGrain; varying vec2 vUv;
    float hash(vec2 p){ p = fract(p*vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float g = hash(gl_FragCoord.xy + fract(uTime) * 91.7) - 0.5;
      // grain is strongest in the mids, leaves pure black clean
      float lum = dot(c.rgb, vec3(0.333));
      gl_FragColor = vec4(c.rgb + g * uGrain * (0.25 + smoothstep(0.0, 0.5, lum)), 1.0);
    }`
};

composer.addPass(rgb);
const invertPass = new ShaderPass(invertShader);
composer.addPass(invertPass);
const grainPass = new ShaderPass(grainShader);
composer.addPass(grainPass);

const testBtn = document.getElementById('test-beat');

const jitter = (b, r = 18) => Math.max(1, Math.min(127, Math.round(b + (Math.random() - .5) * r)));
const rnd = (n) => Math.floor(Math.random() * n);
const hit = (status, note, v, r) => handleMIDI([status, note, jitter(v, r)]);
// Each groove plays one 16th step: s = 0..15 inside the bar, bar = bar counter. Channels: 1 kick, 2 snare, 3 hat, 4-6 melodic
const GROOVES = {
  house: { bpm: 122, play(s, bar) {
    if (s % 4 === 0 || s === 10) hit(0x90, 36, s % 4 === 0 ? 118 : 90);
    if (s === 4 || s === 12 || (bar % 4 === 3 && s === 15)) hit(0x91, 38, 105);
    if (s % 2 === 0) hit(0x92, 42, s % 4 === 2 ? 100 : 60, 30);
    else if (Math.random() < 0.25) hit(0x92, 46, 50, 30);
    if (s % 8 === 2) hit(0x93, 48 + rnd(12), 90);
    if (s % 8 === 6) hit(0x94, 55 + rnd(12), 80);
    if (s === 0 && bar % 2 === 0) hit(0x95, 60 + rnd(12), 100);
  } },
  breakbeat: { bpm: 132, play(s, bar) {
    if (s === 0 || s === 7 || s === 10) hit(0x90, 36, s === 0 ? 118 : 92);
    if (s === 4 || s === 12 || (bar % 2 === 1 && s === 15)) hit(0x91, 38, s === 15 ? 60 : 108);
    if (s % 2 === 0) hit(0x92, 42, 70, 30); else if (s === 7 || s === 13) hit(0x92, 46, 60, 20);
    if (s === 3 || s === 11) hit(0x93, 48 + rnd(12), 90);
    if (s === 6) hit(0x94, 55 + rnd(12), 80);
    if (s === 0 && bar % 2 === 0) hit(0x95, 60 + rnd(12), 100);
  } },
  halftime: { bpm: 80, play(s, bar) {
    if (s === 0 || s === 10) hit(0x90, 36, s === 0 ? 120 : 95);
    if (s === 8) hit(0x91, 38, 112);
    hit(0x92, 42, s % 4 === 2 ? 95 : 50, 25);
    if (s === 0 && bar % 2 === 0) hit(0x93, 48 + rnd(12), 100);
    if (s === 8) hit(0x94, 55 + rnd(12), 85);
    if (s === 12) hit(0x95, 60 + rnd(12), 80);
  } },
  dnb: { bpm: 174, play(s, bar) {
    if (s === 0 || s === 10) hit(0x90, 36, 115);
    if (s === 4 || s === 12) hit(0x91, 38, 110);
    hit(0x92, 42, s % 2 === 0 ? 75 : 45, 25);
    if (s === 6 || s === 14) hit(0x93, 48 + rnd(12), 85);
    if (s === 2 && bar % 2 === 0) hit(0x94, 55 + rnd(12), 80);
    if (s === 0 && bar % 4 === 0) hit(0x95, 60 + rnd(12), 100);
  } },
  ambient: { bpm: 90, play(s, bar) {
    if (s === 0 && bar % 2 === 0) hit(0x90, 36, 85);
    if (s === 12 && bar % 4 === 3) hit(0x91, 38, 70);
    if (s % 4 === 2 && Math.random() < 0.5) hit(0x92, 42, 50, 20);
    if (s === 0) hit(0x93 + (bar % 3), 48 + rnd(24), 90);
    if (s === 8 && bar % 2 === 1) hit(0x94 + (bar % 2), 55 + rnd(12), 75);
  } }
};
function testTick() {
  const g = GROOVES[cfg.groove] || GROOVES.house;
  const s = testStep % 16, bar = Math.floor(testStep / 16);
  g.play(s, bar);
  // slow CC sweeps
  const t = (performance.now() - testStart) / 1000;
  handleMIDI([0xb0, 74, Math.round((0.5 + 0.5 * Math.sin(t * 0.35 + 0.6)) * 127)]);
  handleMIDI([0xb0, s % 2 ? 12 : 13, Math.round((0.5 + 0.5 * Math.sin(t * 0.22 + 4)) * 127)]);
  testStep++;
}
function stopTest() {

  CLK.running = null; CLK.bpm = 0; CLK.times = [];
}
function startTest() {
  clearInterval(testTimer); testOn = true;
  testBtn.classList.add('on'); testBtn.textContent = 'Stop Beat';
  const g = GROOVES[cfg.groove] || GROOVES.house;
  // one timer drives both the clock (24 ppqn) and the groove (every 6th tick), so they never drift apart
  testStep = 0; testStart = performance.now();

    stopMeter();
    actx = new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    analyser = actx.createAnalyser(); analyser.fftSize = 1024;
    actx.createMediaStreamSource(stream).connect(analyser);   // not routed to speakers
    buf = new Float32Array(analyser.fftSize);
    meterTimer = setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let pk = 0; for (const v of buf) pk = Math.max(pk, Math.abs(v));
      bar.style.width = Math.min(100, pk * 140) + '%';
    }, 60);
  }
  function stopMeter() {
    clearInterval(meterTimer); bar.style.width = '0';
    if (actx) { actx.close(); actx = null; }
  }
  async function fillDevices() {
    let devs = [];
    try { devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); } catch (_) {}
    const cur = audioStream && audioStream.getAudioTracks()[0]?.getSettings().deviceId;
    sel.innerHTML = '<option value="">none (silent)</option>';
    if (!devs.some(d => d.deviceId && d.label)) {
      // Chrome hides ids/labels until mic permission is granted
      sel.innerHTML += '<option value="__grant">Allow audio access…</option>';
      sel.value = '';
      return;
    }
    for (const d of devs.filter(d => d.deviceId)) {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || 'audio input';
      sel.appendChild(o);
    }
    sel.value = cur || '';
  }
    sel.addEventListener('change', async () => {
    if (sel.value === '__grant') {
      try {
        const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
        tmp.getTracks().forEach(t => t.stop());
        info.textContent = 'allowed — pick an input';
      } catch (e) { info.textContent = 'error: ' + e.name; }
      await fillDevices();
      return;
    }
    if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
    stopMeter();
    if (!sel.value) { info.textContent = 'not connected (recording will be silent)'; return; }
    try {
      audioStream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: sel.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      await fillDevices();
      startMeter(audioStream);
      info.textContent = '✓ connected: ' + (audioStream.getAudioTracks()[0].label || 'input');
    } catch (e) { sel.value = ''; info.textContent = 'error: ' + e.name; }
  });
  fillDevices();
}

let recorder = null, recChunks = [];
function toggleRecord() {
  if (recorder) { recorder.stop(); return; }
  if (!window.MediaRecorder) { flashStatus('recording unsupported'); return; }
  const stream = renderer.domElement.captureStream(60);
  if (audioStream) audioStream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recChunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6, audioBitsPerSecond: 192000 });
  recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(recChunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ms-vis-${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    recorder = null; recChunks = [];
    recDot.classList.remove('on');
  };
  recorder.start(1000);
  flashStatus(stream.getAudioTracks().length ? 'rec + audio' : 'rec (no audio input selected)');
  recDot.classList.add('on');
}
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFullscreen();
  else if (k === 'r') toggleRecord();
  else if (k === 't') testBtn.click();
});

/* ------------------------------------------------------------------ */
/* Loop                                                                */
/* ------------------------------------------------------------------ */
// Auto quality: lower particle density (and, as a last resort, pixel ratio) when FPS drops
const Q = { q: 1, acc: 0, frames: 0, good: 0, warm: 3, fps: 60 };
const panelTitle = panel.querySelector('h4');
function setPR(pr) {
  curPR = pr;
  renderer.setPixelRatio(pr);
  composer.setPixelRatio(pr);
  composer.setSize(innerWidth, innerHeight);
  shared.uPx.value = pr * innerHeight / 900;
}
function updateQuality(raw) {
  if (document.hidden || raw > 0.5) return;       // ignore tab switches / stalls
  Q.acc += raw; Q.frames++;
  if (Q.warm > 0) { Q.warm -= raw; Q.acc = 0; Q.frames = 0; return; }   // shader compile warm-up
  if (Q.acc < 1) return;
  Q.fps = Q.frames / Q.acc; Q.acc = 0; Q.frames = 0;
  if (cfg.auto) {
    if (Q.fps < 45) { Q.q = Math.max(0.1, Q.q - 0.15); Q.good = 0; }
    else if (Q.fps > 57) { if (++Q.good >= 5) { Q.q = Math.min(1, Q.q + 0.05); Q.good = 0; } }
    else Q.good = 0;
  } else Q.q = 1;
  if (!recorder) {                                   // never resize the canvas mid-recording
    if (curPR > 1 && Q.q < 0.4) setPR(1);
    else if (curPR < PR && Q.q >= 0.7) setPR(PR);
  }
  panelTitle.textContent = `Settings · ${Math.round(Q.fps)} fps · quality ${Math.round(Q.q * 100)}%`;
}

const clock = new THREE.Clock();
let camAngle = 0;
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);
  updateQuality(raw);
  const now = performance.now();
  shared.uTime.value += dt;

  // envelopes
  S.kick  *= Math.exp(-dt * cfg.kickDecay);
  S.snare *= Math.exp(-dt * cfg.snareDecay);
  S.beatFx *= Math.exp(-dt * 6); S.barFx *= Math.exp(-dt * 2.5);
  for (let i = 0; i < 6; i++) {
    S.waveAge[i] += dt; S.wave[i] *= Math.exp(-dt * 1.3);
    shared.uWaveAge.value[i] = S.waveAge[i]; shared.uWaveAmt.value[i] = S.wave[i];
  }
  const ease = 1 - Math.exp(-dt * 6);
  const calmT = cfg.idle > 0 && (now - S.lastMidi) / 1000 > cfg.idle ? 1 : 0;
  S.calm += (calmT - S.calm) * (1 - Math.exp(-dt * (calmT ? 0.6 : 8)));   // slow fade out, fast wake-up
  S.bend += (S.bendT - S.bend) * ease;
  S.cutoff += (S.cutoffT - S.cutoff) * ease;
  for (const k in S.mod) S.mod[k] += (S.modT[k] - S.mod[k]) * ease;
  const sharpK = 0.4 + 1.2 * S.mod.sharp, brightK = 0.35 + 0.65 * S.mod.bright, sizeK = 0.5 + S.mod.size, spinK = 2 * S.mod.spin;   // each is 1 at the start value
  S.glow   += (S.glowT   - S.glow)   * ease;

  // CC74: 0 -> smooth sphere, 127 -> chaotic hedgehog
  shared.uAmp.value  = (S.cutoff * S.cutoff * 0.95 + (S.cutoff > 0.001 ? 0.01 : 0)) * (1 - 0.8 * S.calm);
  shared.uFreq.value = 0.7 + S.cutoff * 3.3;
  shared.uKick.value = S.kick;
  let shrink = 0;                                          // shape transition: collapse, swap at the smallest size, bloom back
  if (shapeState.pending) {
    shapeState.t += dt;
    const k = Math.min(1, shapeState.t / SHAPE_TIME);
    shrink = Math.sin(k * Math.PI) * 0.75;
    if (k >= 0.5 && shapeState.cur !== shapeState.pending) showShape(shapeState.pending);
    if (k >= 1) shapeState.pending = null;
  }
  shared.uShrink.value = shrink;
  shared.uBeat.value = Math.min(1, (S.beatFx * 0.5 + S.barFx * 0.5));
  hatPoints.material.uniforms.uTrail.value = cfg.trail;
  grainPass.uniforms.uTime.value = shared.uTime.value;
  grainPass.uniforms.uGrain.value = cfg.grain;
  shared.uDensity.value = cfg.density * (0.25 + 0.75 * Q.q);
  shared.uSize.value = cfg.size * sizeK;
  shared.uBright.value = cfg.bright * brightK;
  shared.uSharp.value = sharpK;

  // CC12/13: bloom intensity
  bloom.strength = (cfg.glowBase + S.glow * cfg.glowRange + S.kick * 0.5 + S.beatFx * 0.3 + S.barFx * 0.5) * (1 - 0.5 * S.calm);

  // snare: chromatic aberration + 100 ms invert
  rgb.uniforms.amount.value = 0.0004 + S.snare * cfg.shift;
  rgb.uniforms.angle.value += dt * 0.6;
  invertPass.uniforms.uInvert.value = now < S.invertUntil ? 1 : 0;

  // camera: slow orbit + kick zoom
  camAngle += dt * 0.08;
  const dist = BASE_Z - S.kick * cfg.zoom;
  camera.position.set(Math.sin(camAngle) * dist * 0.35, Math.sin(camAngle * 0.7) * 0.4, Math.cos(camAngle * 0.5) * 0.15 + dist);
  camera.lookAt(0, 0, 0);
  camera.rotateZ(S.bend * 0.6);                       // pitch bend rolls the camera
  // scanner band: angle = position inside the bar (96 clock ticks), interpolated between ticks
  const alive = clockAlive(now);
  const tickMs = 60000 / (Math.max(CLK.bpm, 1) * 24);
  const posTicks = (CLK.tick - 1) + THREE.MathUtils.clamp((now - CLK.lastTick) / tickMs, 0, 1);
  const barPhase = (((posTicks / 96) % 1) + 1) % 1;
  S.bandA += ((alive ? Math.min(1, cfg.clockFx) : 0) - S.bandA) * ease;
  shared.uBand.value.set(Math.PI * barPhase, S.bandA * (0.7 + 0.3 * Math.min(1, S.beatFx)), 0);   // a plane repeats every half turn: one sweep per bar
  const tempoT = alive ? THREE.MathUtils.clamp(CLK.bpm / 120, 0.5, 2) : 1;   // rotation follows the tempo
  S.tempoK += (tempoT - S.tempoK) * ease;
  world.rotation.y += dt * (0.08 + S.cutoff * 0.12) * cfg.spin * spinK * (1 - 0.6 * S.calm) * S.tempoK;

  // rings
  for (const r of rings) {
    r.pulse *= Math.exp(-dt * (now < r.hold ? 0.6 : 4));
    r.spin *= Math.exp(-dt * 0.5);
    r.holder.rotation.z += r.spin * dt;
    r.holder.rotation.x += (r.tilt - r.holder.rotation.x) * Math.min(1, dt * 2);
    const sc = 1 + r.pulse * 0.18;
    r.holder.scale.setScalar(sc);
    r.mat.opacity = 0.2 + r.pulse * 0.7;
    r.mat.color.setRGB(1, 1, 1).lerp(ORANGE, Math.min(1, r.pulse * 1.2));
  }

  uploadHat();
  composer.render();
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  shared.uPx.value = curPR * innerHeight / 900;
});
</script>
</body>
